<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Security Verification</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            touch-action: manipulation;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        
        #lockScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #000000 0%, #1a0000 100%);
            z-index: 999999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .warning {
            color: #ff0000;
            font-size: 1.8rem;
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 0 0 10px #ff0000;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }
        
        .lockBox {
            background: rgba(30, 0, 0, 0.9);
            border: 3px solid #ff0000;
            border-radius: 20px;
            padding: 40px 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.5);
        }
        
        .title {
            color: #fff;
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 25px;
            font-weight: bold;
        }
        
        .inputGroup {
            margin-bottom: 25px;
        }
        
        #codeInput {
            width: 100%;
            padding: 18px;
            font-size: 1.3rem;
            text-align: center;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #444;
            border-radius: 10px;
            color: #fff;
            letter-spacing: 3px;
            outline: none;
        }
        
        #codeInput:focus {
            border-color: #ff0000;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
        }
        
        #unlockBtn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(to bottom, #ff0000, #990000);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        #unlockBtn:active {
            transform: scale(0.98);
            background: linear-gradient(to bottom, #cc0000, #770000);
        }
        
        #message {
            margin-top: 20px;
            min-height: 25px;
            text-align: center;
            font-size: 1rem;
        }
        
        .error {
            color: #ff9900;
            animation: shake 0.5s;
        }
        
        .success {
            color: #00ff00;
            font-size: 1.5rem;
            font-weight: bold;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        
        /* Blur effect untuk background */
        .blur {
            filter: blur(5px);
        }
        
        /* Hide scrollbar */
        ::-webkit-scrollbar {
            display: none;
        }
        
        /* Anti-inspect */
        .no-inspect {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
    </style>
</head>
<body class="no-inspect">
    <div id="lockScreen">
        <div class="warning">⚠️ WARNING: DEVICE LOCKED ⚠️</div>
        
        <div class="lockBox">
            <div class="title">Enter Security Code to Unlock</div>
            
            <div class="inputGroup">
                <input type="password" id="codeInput" placeholder="Enter 6-digit code" maxlength="6" autocomplete="off">
            </div>
            
            <button id="unlockBtn">UNLOCK DEVICE</button>
            
            <div id="message"></div>
        </div>
        
        <div style="color: #666; text-align: center; margin-top: 30px; font-size: 0.9rem;">
            System Security v2.1 • Attempts monitored
        </div>
    </div>

    <script>
        // ======================
        // ANTI-CLOSE & ANTI-ESCAPE
        // ======================
        
        // Block back button
        history.pushState(null, null, location.href);
        window.onpopstate = function(event) {
            history.go(1);
        };
        
        // Block right click & inspect
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            showMessage('Inspect disabled!', 'error');
            return false;
        });
        
        // Block keyboard shortcuts (F12, Ctrl+Shift+I, Ctrl+U, etc)
        document.addEventListener('keydown', function(e) {
            // F12, Ctrl+Shift+I, Ctrl+U, Ctrl+Shift+J, Ctrl+Shift+C
            if (e.keyCode === 123 || 
                (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) ||
                (e.ctrlKey && e.keyCode === 85)) {
                e.preventDefault();
                showMessage('Developer tools disabled!', 'error');
                return false;
            }
            
            // Escape key
            if (e.keyCode === 27) {
                e.preventDefault();
                showMessage('Escape blocked!', 'error');
                return false;
            }
            
            // Alt + Tab, Windows key, etc
            if (e.altKey || e.metaKey) {
                e.preventDefault();
            }
        });
        
        // Request fullscreen
        function requestFullscreen() {
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) { /* Safari */
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) { /* IE11 */
                elem.msRequestFullscreen();
            }
        }
        
        // Exit fullscreen on correct code
        function exitFullscreen() {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            } else if (document.webkitExitFullscreen) { /* Safari */
                document.webkitExitFullscreen();
            } else if (document.msExitFullscreen) { /* IE11 */
                document.msExitFullscreen();
            }
        }
        
        // ======================
        // LOCK LOGIC
        // ======================
        
        const CORRECT_CODE = "wanzyx";
        let attempts = 0;
        const MAX_ATTEMPTS = 5;
        
        // Focus input on load
        document.getElementById('codeInput').focus();
        
        // Unlock button click
        document.getElementById('unlockBtn').addEventListener('click', checkCode);
        
        // Enter key support
        document.getElementById('codeInput').addEventListener('keyup', function(e) {
            if (e.keyCode === 13) {
                checkCode();
            }
        });
        
        function checkCode() {
            const input = document.getElementById('codeInput').value;
            const messageEl = document.getElementById('message');
            
            if (input === CORRECT_CODE) {
                // SUCCESS - Unlock
                messageEl.innerHTML = '<span class="success">✅ ACCESS GRANTED! Unlocking...</span>';
                document.getElementById('codeInput').disabled = true;
                document.getElementById('unlockBtn').disabled = true;
                
                // Exit fullscreen
                exitFullscreen();
                
                // Show unlock animation
                setTimeout(() => {
                    document.getElementById('lockScreen').style.opacity = '0';
                    document.getElementById('lockScreen').style.transition = 'opacity 1s';
                    
                    setTimeout(() => {
                        document.body.innerHTML = `
                            <div style="text-align:center; padding:50px; background:#000; color:#0f0; height:100vh;">
                                <h1 style="font-size:2.5rem;">✅ DEVICE UNLOCKED</h1>
                                <p style="font-size:1.2rem; margin-top:20px;">Security clearance verified.</p>
                                <p style="color:#888; margin-top:30px;">You may now close this page.</p>
                            </div>
                        `;
                        // Allow normal behavior
                        document.removeEventListener('keydown', arguments.callee);
                        document.removeEventListener('contextmenu', arguments.callee);
                    }, 1000);
                }, 1500);
                
            } else {
                // WRONG CODE
                attempts++;
                const remaining = MAX_ATTEMPTS - attempts;
                
                if (attempts >= MAX_ATTEMPTS) {
                    // MAX ATTEMPTS REACHED
                    messageEl.innerHTML = '<span class="error">❌ MAX ATTEMPTS REACHED! Device permanently locked.</span>';
                    document.getElementById('codeInput').disabled = true;
                    document.getElementById('unlockBtn').disabled = true;
                    
                    // Simulate "permanent" lock
                    document.getElementById('lockScreen').style.background = 'linear-gradient(135deg, #000000 0%, #330000 100%)';
                    document.querySelector('.warning').textContent = '⛔ PERMANENTLY LOCKED ⛔';
                    document.querySelector('.warning').style.color = '#ff3300';
                    
                    // Start annoying effects
                    setInterval(() => {
                        document.body.style.backgroundColor = (document.body.style.backgroundColor === 'black') ? '#330000' : 'black';
                    }, 500);
                    
                } else {
                    // Show error
                    messageEl.innerHTML = `<span class="error">❌ Invalid code! ${remaining} attempt(s) remaining.</span>`;
                    document.getElementById('codeInput').value = '';
                    document.getElementById('codeInput').style.borderColor = '#ff0000';
                    document.getElementById('codeInput').style.boxShadow = '0 0 15px rgba(255, 0, 0, 0.7)';
                    
                    // Shake effect
                    document.querySelector('.lockBox').style.animation = 'shake 0.5s';
                    setTimeout(() => {
                        document.querySelector('.lockBox').style.animation = '';
                    }, 500);
                    
                    // Focus back to input
                    document.getElementById('codeInput').focus();
                }
            }
        }
        
        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.innerHTML = `<span class="${type}">${text}</span>`;
            setTimeout(() => {
                msg.innerHTML = '';
            }, 2000);
        }
        
        // ======================
        // ENHANCED PROTECTION
        // ======================
        
        // Prevent drag/drop
        document.addEventListener('dragstart', function(e) {
            e.preventDefault();
            return false;
        });
        
        document.addEventListener('drop', function(e) {
            e.preventDefault();
            return false;
        });
        
        // Blur on visibility change (tab switch)
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                // User switched tabs - bring back focus
                requestFullscreen();
                showMessage('Do not switch tabs!', 'error');
            }
        });
        
        // Prevent leaving page
        window.onbeforeunload = function(e) {
            e.preventDefault();
            e.returnValue = '';
            return '';
        };
        
        // Auto-request fullscreen
        window.onload = function() {
            setTimeout(requestFullscreen, 500);
            
            // Prevent zoom
            document.addEventListener('gesturestart', function(e) {
                e.preventDefault();
            });
            
            // Prevent pull-to-refresh
            document.addEventListener('touchmove', function(e) {
                if (e.scale !== 1) {
                    e.preventDefault();
                }
            }, { passive: false });
        };
        
        // Keep fullscreen if exited
        document.addEventListener('fullscreenchange', function() {
            if (!document.fullscreenElement) {
                setTimeout(requestFullscreen, 100);
            }
        });
        
        document.addEventListener('webkitfullscreenchange', function() {
            if (!document.webkitFullscreenElement) {
                setTimeout(requestFullscreen, 100);
            }
        });
        
        // ======================
        // FINAL TOUCHES
        // ======================
        
        // Make it look like system dialog
        document.title = "Security Alert - System Dialog";
        
        // Fake loading
        setTimeout(() => {
            document.querySelector('.warning').innerHTML = '⚠️ SECURITY LOCK ACTIVATED ⚠️';
        }, 2000);
        
        console.log = console.warn = console.error = function() {};
    </script>
</body>
  </html>
